<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Login Form</h1>

  <form id="loginForm">

    <input
      type="text"
      placeholder="Username"
      id="username"
      value=""
    />

    <br><br>

    <input
      type="password"
      placeholder="Password"
      id="password"
      value=""
    />

    <br><br>

    <input type="checkbox" id="checkbox" />

    <label for="checkbox">Remember me.</label>

    <br><br>

    <input
      type="submit"
      id="submit"
      value="Submit"
    />

  </form>

  <br>

  <button id="existing" hidden>
    Login as existing user
  </button>

  <script src="./script.js"></script>

</body>

</html>
